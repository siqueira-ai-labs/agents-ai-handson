      string: "{\"query\":\"GPT-4 parameters count\",\"follow_up_questions\":null,\"answer\":null,\"images\":[],\"results\":[{\"url\":\"https://explodingtopics.com/blog/gpt-parameters\",\"title\":\"Number
        of Parameters in GPT-4 (Latest Data)\",\"content\":\"In June 2023, just a
        few months after GPT-4 was released, Hotz publicly explained that GPT-4 was
        comprised of roughly 1.8 trillion parameters. More specifically, the architecture
        consisted of eight models, with each internal model made up of 220 billion
        parameters.\\n\\nGPT4 is 8 x 220B params = 1.7 Trillion params   \\n  \\nok
        I wasn't sure how widely to spread the rumors on GPT-4 but it seems Soumith
        is also confirming the same so here's the quick clip!   \\n  \\nso yes, GPT4
        is technically 10x the size of GPT3, and all the small\u2026 pic.twitter.com/m2YiaHGVs4\\n\\nWhile
        this has not been confirmed by OpenAI, the 1.8 trillion parameter claim has
        been supported by multiple sources. [...] While these estimates vary somewhat,
        they all agree on one thing: GPT-4 is massive. It\u2019s far larger than previous
        models and many competitors.\\n\\nHowever, more parameters doesn\u2019t necessarily
        mean better.\\n\\nIn this article, we\u2019ll explore the details of the parameters
        within GPT-4 and GPT-4o.\\n\\n### Key Parameters Stats (Top Picks)\\n\\n###
        Instantly Analyze Any Market\\n\\n### Number of Parameters in ChatGPT-4\\n\\nAccording
        to multiple sources, ChatGPT-4 has approximately 1.8 trillion parameters.\\n\\nThis
        estimate first came from AI experts like George Hotz, who is also known for
        being the first person to crack the iPhone. [...] Shortly after Hotz made
        his estimation, a report by Semianalysis reached the same conclusion. More
        recently, a graph displayed at Nvidia\u2019s GTC24 seemed to support the 1.8
        trillion figure.\\n\\nAnd back in June 2023, Meta engineer Soumith Chintala
        confirmed Hotz\u2019s description, tweeting:\\n\\n\u201CI might have heard
        the same \u2026 info like this is passed around but no one wants to say it
        out loud. GPT-4: 8 x 220B experts trained with different data/task distributions
        and 16-inter inference.\u201D\\n\\nSo, we can assert with reasonable confidence
        that GPT-4 has 1.76 trillion parameters. But what exactly does the breakdown
        \u2014 eight experts of 220 billion parameters, or 16 of 110 billion \u2014
        mean?\\n\\n### Evolution of ChatGPT Parameters\\n\\n#### ChatGPT-4 has 10x
        the parameters of GPT-3 (OpenAI)\",\"score\":0.9161773,\"raw_content\":null},{\"url\":\"https://aiexpjourney.substack.com/p/the-number-of-parameters-of-gpt-4o\",\"title\":\"The
        Number of Parameters of GPT-4o and Claude 3.5 Sonnet\",\"content\":\"AI Exploration
        Journey\\n\\n# AI Exploration Journey\\n\\n# The Number of Parameters of GPT-4o
        and Claude 3.5 Sonnet\\n\\nFlorian's avatar\\n\\nRecently, I saw a paper from
        Microsoft that surprisingly revealed the parameter counts for models such
        as GPT-4o and Claude 3.5 Sonnet.\\n\\nFrom Figure 2, we can get a glimpse
        of the details.\\n\\nAI Exploration Journey is a reader-supported publication.
        To receive new posts and support my work, consider becoming a subscriber.\\n\\nAccording
        to Figure 2, we can see that GPT-4o contains approximately 200 billion parameters,
        while GPT-4o-mini has about 8 billion parameters. Claude 3.5 Sonnet operates
        with roughly 175 billion parameters.\\n\\nChatGPT uses approximately 175 billion
        parameters, while GPT-4 is significantly larger with about 1.76 trillion parameters.\",\"score\":0.9067276,\"raw_content\":null},{\"url\":\"https://www.lesswrong.com/posts/kywRXvv2mhkyfPD84/gpt-4-specs-1-trillion-parameters\",\"title\":\"GPT-4
        Specs: 1 Trillion Parameters? - LessWrong\",\"content\":\"GPT-3 had 175 Billion
        parameters. I've seen a few references online to some interview where Sam
        Altman said GPT-4 actually has fewer parameters than GPT-3 but different architecture
        and more training. I can't find the original source so I can't verify that
        quote, but assuming that's true, that gives us a lower bound of slightly smaller
        than GPT-3's 175 Billion parameters.  \\n  \\nLooking at the compute architecture
        that it's running on, an upper bound of 343 billion parameters seems reasonable.
        [...] GPT-4 was trained on OpenAI's new supercomputer which is composed of
        [edit] NVIDIA DGX A100 nodes.   \\n  \\nI'm assuming each individual instance
        of GPT-4 runs on one DGX A100 node.   \\n  \\nEach DGX node has 8x A100 GPUs.
        Each A100 can have either 40 or 80GB vram. So a single DGX node running GPT-4
        has either 320 or 640 GB. That can allow us to calculate an upper limit to
        the number of parameters in a single GPT-4 instance.  \\n  \\nAssuming GPT-4
        uses float16 to represent parameters (same as GPT-3), and assuming they're
        using the 80GB A100s, that gives us an upper limit of 343 billion parameters
        in one GPT-4 instance. [...] Another quote from the paper:\\n\\n\\\"Unless
        one has a compute budget of 1026 FLOPs (over 250\xD7 the compute used to train
        Gopher), a 1 trillion parameter model is unlikely to be the optimal model
        to train.\\\"\\n\\nSo unless the EpochAI estimate is too low by about an order
        of magnitude (#fn125dcuy17199) or OpenAI has discovered new and better scaling
        laws, the number of parameters in GPT-4 is probably lower than 1 trillion.\\n\\nMy
        Twitter thread estimating the number of parameters in GPT-4.\\n\\nI don't
        think it is but it could be.\\n\\n# 6\\n\\nRelevant Manifold Market:\",\"score\":0.882276,\"raw_content\":null}],\"response_time\":1.67,\"request_id\":\"dd9f4ce5-c9c1-46bc-8a49-2ba1523989ea\"}"
